name: Check secrets

# Reports which release secrets are set (never their values) and tests the Supabase key
# against the project. Run it by hand after adding or rotating secrets.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://yomgyukfzlnjxcvdsivw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Which secrets are set
        run: |
          for name in SUPABASE_SERVICE_ROLE_KEY MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -n "${!name}" ]; then echo "set      $name"; else echo "MISSING  $name"; fi
          done

      - name: Supabase key works
        run: |
          KEY="$SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$KEY" ] || { echo "SUPABASE_SERVICE_ROLE_KEY is not set"; exit 1; }
          # Legacy JWT keys also go in Authorization; newer sb_secret_ keys must not.
          AUTH=()
          case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
          status() { curl -sS -o /dev/null -w '%{http_code}' "$1" -H "apikey: $KEY" "${AUTH[@]}"; }
          DB=$(status "$SUPABASE_URL/rest/v1/releases?select=version&limit=1")
          BUCKET=$(status "$SUPABASE_URL/storage/v1/bucket/releases")
          echo "database access: HTTP $DB (200 = ok)"
          echo "releases bucket: HTTP $BUCKET (200 = ok)"
          [ "$DB" = "200" ] && [ "$BUCKET" = "200" ]
